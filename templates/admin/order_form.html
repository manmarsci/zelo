{% extends "admin/base.html" %}
{% block content %}
<h1>Create New Order</h1>
<form method="post" class="admin-form" id="orderForm">
  <h3>Customer</h3>
  <div class="form-row-2">
    <div>
      <label>Select Existing Customer</label>
      <select name="customer_id" id="customerSelect" onchange="toggleGuestFields()">
        <option value="">— Walk-in / Guest Customer —</option>
        {% for c in customers %}
          <option value="{{ c.id }}">{{ c.name }} ({{ c.email }})</option>
        {% endfor %}
      </select>
    </div>
  </div>
  
  <div id="guestFields">
    <div class="form-row-3">
      <div>
        <label>Guest Name *</label>
        <input type="text" name="guest_name" />
      </div>
      <div>
        <label>Guest Email *</label>
        <input type="email" name="guest_email" />
      </div>
      <div>
        <label>Guest Phone *</label>
        <input type="tel" name="guest_phone" />
      </div>
    </div>
  </div>

  <h3>Shipping Address</h3>
  <div class="form-row-2">
    <div>
      <label>Recipient Name *</label>
      <input type="text" name="shipping_name" required />
    </div>
    <div>
      <label>Recipient Phone *</label>
      <input type="tel" name="shipping_phone" required />
    </div>
  </div>
  <div class="form-row">
    <label>Complete Address *</label>
    <textarea name="shipping_address" required></textarea>
  </div>
  <div class="form-row-3">
    <div>
      <label>City *</label>
      <input type="text" name="shipping_city" required />
    </div>
    <div>
      <label>Province *</label>
      <select name="shipping_province" required>
        <option value="">Select Province</option>
        <option>Punjab</option><option>Sindh</option><option>KPK</option>
        <option>Balochistan</option><option>Islamabad</option>
      </select>
    </div>
    <div>
      <label>Postal Code</label>
      <input type="text" name="shipping_postal" />
    </div>
  </div>

  <h3>Products</h3>
  <div id="productRows">
    <div class="product-row form-row-3">
      <div>
        <label>Product *</label>
        <select name="product_id[]" required onchange="updatePrice(this)">
          <option value="">Select Product</option>
          {% for p in products %}
            <option value="{{ p.id }}" data-price="{{ p.sale_price or p.original_price }}">{{ p.name }} (PKR {{ "%.0f"|format(p.sale_price or p.original_price) }})</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label>Quantity *</label>
        <input type="number" name="quantity[]" value="1" min="1" required />
      </div>
      <div>
        <label>Price (PKR) *</label>
        <input type="number" name="price[]" step="0.01" required />
      </div>
    </div>
  </div>
  <button type="button" class="btn btn-outline" onclick="addProductRow()" style="margin-top:.5rem">+ Add Another Product</button>

  <h3>Order Details</h3>
  <div class="form-row-3">
    <div>
      <label>Delivery Charges (PKR)</label>
      <input type="number" name="delivery_charges" value="150" step="0.01" />
    </div>
    <div>
      <label>Discount (PKR)</label>
      <input type="number" name="discount" value="0" step="0.01" />
    </div>
    <div>
      <label>Payment Method</label>
      <select name="payment_method">
        <option value="COD">Cash on Delivery</option>
        <option value="Online">Online Payment</option>
      </select>
    </div>
  </div>
  <div class="form-row">
    <label>Order Status</label>
    <select name="status">
      <option value="Pending">Pending</option>
      <option value="Confirmed">Confirmed</option>
      <option value="Shipped">Shipped</option>
      <option value="Delivered">Delivered</option>
    </select>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Create Order</button>
    <a href="{{ url_for('admin_orders') }}" class="btn btn-outline">Cancel</a>
  </div>
</form>

<script>
function toggleGuestFields() {
  const select = document.getElementById('customerSelect');
  const guestFields = document.getElementById('guestFields');
  if (select.value) {
    guestFields.style.display = 'none';
    guestFields.querySelectorAll('input').forEach(i => i.required = false);
  } else {
    guestFields.style.display = 'block';
    guestFields.querySelectorAll('input').forEach(i => i.required = true);
  }
}

function addProductRow() {
  const container = document.getElementById('productRows');
  const newRow = container.firstElementChild.cloneNode(true);
  newRow.querySelectorAll('input, select').forEach(el => {
    if (el.type === 'number') el.value = el.name.includes('quantity') ? 1 : '';
    else if (el.tagName === 'SELECT') el.selectedIndex = 0;
  });
  container.appendChild(newRow);
}

function updatePrice(select) {
  const row = select.closest('.product-row');
  const priceInput = row.querySelector('[name="price[]"]');
  const selectedOption = select.options[select.selectedIndex];
  if (selectedOption.dataset.price) {
    priceInput.value = selectedOption.dataset.price;
  }
}

// Initialize
toggleGuestFields();
</script>
{% endblock %}
