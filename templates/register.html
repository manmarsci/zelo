{% extends "base.html" %}
{% block title %}Create Account{% endblock %}
{% block content %}
<section class="section">
  <div class="container auth-wrap">
    <div class="auth-card">
      <h1>Create Account</h1>
      <p class="muted">Join ZELO LIVE for exclusive deals.</p>
      <form method="post">
        <input type="text" name="name" placeholder="Full Name" required />
        <input type="email" name="email" placeholder="Email" required />
        <input type="tel" name="phone" placeholder="Mobile Number" />
        <input type="password" name="password" placeholder="Password (min 6 chars)" required minlength="6" />
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>
      <p class="auth-foot">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
    </div>
  </div>
</section>
{% endblock %}
